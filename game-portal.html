<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game Portal</title>
  <style>
    body {
      background: #0a001f;
      color: #0ff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 60px;
      text-shadow: 0 0 30px #0ff;
      margin-bottom: 30px;
    }
    .card {
      width: 380px;
      background: rgba(40, 0, 100, 0.9);
      border: 5px solid #0ff;
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      transition: 0.3s;
    }
    .card:hover {
      border-color: #f0f;
      transform: scale(1.05);
    }
    a {
      text-decoration: none;
      color: white;
    }
    button {
      margin-top: 20px;
      padding: 15px 60px;
      font-size: 22px;
      background: #0ff;
      color: #000;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <a href="space-dodger.html">
      <h2>🚀 Space Dodger</h2>
      <p>Dodge falling asteroids in space</p>
      <button>PLAY GAME</button>
    </a>
  </div>

</body>
</html>
